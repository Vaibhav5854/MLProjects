<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta charset="UTF-8" />
  <title>Student Exam Performance Indicator</title>
</head>
<body>

  <h1>Student Exam Performance Indicator</h1>
  <h2>Student Exam Performance Prediction</h2>

  <form action="{{ url_for('predict_datapoint') }}" method="POST">

    <label>Gender</label>
    <select name="gender">
      <option value="">Select your Gender</option>
      <option value="male">male</option>
      <option value="female">female</option>
    </select>
    <br><br>

    <label>race_ethnicity</label>
    <select name="race_ethnicity">
      <option value="">Select Race/Ethnicity</option>
      <option value="group A">group A</option>
      <option value="group B">group B</option>
      <option value="group C">group C</option>
      <option value="group D">group D</option>
      <option value="group E">group E</option>
    </select>
    <br><br>

    <label>parental_level_of_education</label>
    <select name="parental_level_of_education">
      <option value="">Select Parent Education</option>
      <option value="some high school">some high school</option>
      <option value="high school">high school</option>
      <option value="some college">some college</option>
      <option value="associate's degree">associate's degree</option>
      <option value="bachelor's degree">bachelor's degree</option>
      <option value="master's degree">master's degree</option>
    </select>
    <br><br>

    <label>lunch_type</label>
    <select name="lunch">
      <option value="">Select Lunch Type</option>
      <option value="standard">standard</option>
      <option value="free/reduced">free/reduced</option>
    </select>
    <br><br>

    <label>test_preparation_course</label>
    <select name="test_preparation_course">
      <option value="">Select Test Course</option>
      <option value="none">none</option>
      <option value="completed">completed</option>
    </select>
    <br><br>

    <label>Writing Score out of 100</label>
    <input type="number" name="writing_score" min="0" max="100" placeholder="Enter your writing score" />
    <br><br>

    <label>Reading Score out of 100</label>
    <input type="number" name="reading_score" min="0" max="100" placeholder="Enter your reading score" />
    <br><br>

    <button type="submit">Predict your Maths Score</button>

  </form>

  <h2>
    
    THE prediction is {{results}}

  </h2>

</body>
</html>
